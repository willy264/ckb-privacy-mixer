cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "2"
members = [
    "contracts/mixer-pool-type",
    "contracts/nullifier-type",
    "contracts/zk-membership-type",
    "tests"
]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "immediate-abort"
