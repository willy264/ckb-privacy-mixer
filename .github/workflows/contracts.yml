          test "$(pnpm --version)" = "10.32.1"
          test "$(rustup show active-toolchain | cut -d' ' -f1)" = "nightly-2026-03-25-x86_64-unknown-linux-gnu"
          test "$(circom --version)" = "circom compiler 2.2.3"
          rustup component list --installed | grep -Fx 'rust-src'
          rustfmt --version
          cargo clippy --version

      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Regenerate legacy Groth16 verification key
        run: |
          pnpm --filter ckb-mixer-backend exec tsx ../scripts/generate-vk-rs.ts
          rustfmt --edition 2024 contracts/zk-membership-type/src/vk.rs
      - name: Regenerate legacy Groth16 verification key
        run: |
          pnpm --filter ckb-mixer-backend exec tsx ../scripts/generate-vk-rs.ts
          rustfmt --edition 2024 contracts/zk-membership-type/src/vk.rs

      - name: Ensure legacy vk.rs is up to date
        run: git diff --exit-code -- contracts/zk-membership-type/src/vk.rs
      - name: Ensure legacy vk.rs is up to date
        run: git diff --exit-code -- contracts/zk-membership-type/src/vk.rs

      - name: Build all JavaScript workspaces
        run: pnpm run build

      - name: Test SDK, backend V1, and circuits
        run: pnpm test

      - name: Build and test legacy and V1 RISC-V contracts
        run: pnpm run test:contracts
