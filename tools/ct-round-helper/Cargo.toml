[package]
name = "ct-round-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
bulletproofs = { git = "https://github.com/zkcrypto/bulletproofs", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "rand_core"] }
merlin = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
